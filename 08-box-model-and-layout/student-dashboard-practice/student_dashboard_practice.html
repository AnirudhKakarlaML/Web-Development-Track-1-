<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="student_dashboard_practice.css">
</head>

<body>

    <header id="main-header">
        <h1>Student Dashboard</h1>
        <p id="mainpgph">Build. Learn. Improve.</p>
    </header>

    <main>

        <section class="profile-card">
            <h2>Anirudh</h2>
            <p class="role">B.Tech Student</p>
            <p>Learning DSA and Web Development.</p>
            <button>Edit Profile</button>
        </section>

        <section id="progress">

            <h2>Current Progress</h2>

            <article class="progress-card">
                <h3>HTML</h3>
                <p>Completed</p>
                <button>View Work</button>
            </article>

            <article class="progress-card">
                <h3>CSS</h3>
                <p>In Progress</p>
                <button>Continue</button>
            </article>

            <article class="progress-card">
                <h3>JavaScript</h3>
                <p>Not Started</p>
                <button>Locked</button>
            </article>

        </section>

        <section class="tasks">

            <h2>Today's Tasks</h2>

            <p>Complete CSS practice</p>
            <p>Push project to GitHub</p>
            <p>Revise Box Model</p>

        </section>

    </main>

    <footer>
        <p>Consistency beats motivation.</p>
    </footer>

</body>
</html>
