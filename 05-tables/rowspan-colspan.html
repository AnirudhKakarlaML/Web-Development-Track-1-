<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RowSpan And ColSpan</title>
</head>
<body>
    <table border="black">
        <caption>Food Menu</caption>
    <tr>
        <th rowspan="2">Item</th>
        <th colspan="2">Price</th>
    </tr>
    <tr>
        <td ><b>INR</b></td>
<td><b>USD</b></td>
    </tr>
    <tr>
        <td>Frooti</td>
        <td>10</td>
        <td>0.14</td>
    </tr>
    <tr>
        <td>Samosa</td>
        <td>12</td>
        <td>0.17</td>
    </tr>
    <tr>
        <td>Chips</td>
        <td>20</td>
        <td>0.28</td>
    </tr>
    </table>
    <table border="">
        <caption>A Test Table With Merged Cells</caption>
        <tr>
            <th rowspan="2"></th>
            <th colspan="2">Average</th>
            <th rowspan="2">Red eyes</th>
        </tr>
        <tr>
            <td>Height</td>
            <td>Weight</td>
        </tr>
        <tr>
            <td>Males</td>
            <td>1.9</td>
            <td>0.003</td>
            <td>40</td>
        </tr>
        <tr>
            <td>Females</td>
            <td>1.7</td>
            <td>0.002</td>
            <td>43</td>
        </tr>
    </table>
    
</body>
</html>
