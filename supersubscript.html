<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super And Subscript</title>
</head>
<body>
    <!---Super Script-->
    <h1>a<sup>2</sup>+b <sup>2</sup> = c<sup>2</sup></h1>
    <!--Subscript-->
    <h1>H<sub>2</sub>O</h1>
    
</body>
</html>
